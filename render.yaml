services:
  - type: web
    name: viettravel-demo
    runtime: node
    plan: free
    buildCommand: yarn install --frozen-lockfile
    startCommand: yarn start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_POSITION
        sync: false
      - key: HR_EMAIL
        sync: false
      - key: HR_PASSWORD
        sync: false
      - key: HR_FULL_NAME
        sync: false
      - key: HR_PHONE
        sync: false
      - key: HR_POSITION
        sync: false
